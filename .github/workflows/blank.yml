name: Windows RDP (Tailscale)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --hostname=github-rdp

      - name: Enable RDP & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -value 1

      - name: Create/Update RDP User
        run: |
          $Password = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name "rdpuser" -Password $Password
          } else {
            New-LocalUser -Name "rdpuser" -Password $Password -FullName "RDP User"
            Add-LocalGroupMember -Group "Administrators" -Member "rdpuser"
          }

      - name: Show RDP Connection Info
        run: |
          $tsIP = tailscale ip -4
          Write-Host "========================================="
          Write-Host "Tailscale IP : $tsIP"
          Write-Host "Hostname     : github-rdp"
          Write-Host "Username     : rdpuser"
          Write-Host "========================================="

      - name: Keep Session Alive
        run: |
          while ($true) {
            Start-Sleep -Seconds 60
          }
